name: VBA syntax lint

on:
  push:
    paths:
      - "vba/**"
      - "scripts/lint-vba.mjs"
      - ".github/workflows/vba-lint.yml"
  pull_request:
    paths:
      - "vba/**"
      - "scripts/lint-vba.mjs"
      - ".github/workflows/vba-lint.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint VBA modules and forms
        run: node scripts/lint-vba.mjs
